<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FilmFlix - Cadastro de Filmes</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-lg">
                    <div class="card-header">
                        <h3 class="mb-0">Cadastro de Filmes</h3>
                    </div>
                    <div class="card-body">
                        <div id="alertas"></div>

                        <form id="formFilme">
                            <div class="mb-3">
                                <label class="form-label">Título *</label>
                                <input type="text" class="form-control" id="titulo" placeholder="Ex: Homem-Aranha"
                                    required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Gênero *</label>
                                <select class="form-select" id="genero" required>
                                    <option value="">Selecione...</option>
                                    <option value="Ação">Ação</option>
                                    <option value="Comédia">Comédia</option>
                                    <option value="Drama">Drama</option>
                                    <option value="Terror">Terror</option>
                                    <option value="Romance">Romance</option>
                                    <option value="Ficção Científica">Ficção Científica</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Descrição</label>
                                <textarea class="form-control" id="descricao" rows="3"
                                    placeholder="Sinopse do filme..."></textarea>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Classificação Indicativa *</label>
                                    <select class="form-select" id="classificacao" required>
                                        <option value="">Selecione...</option>
                                        <option value="Livre">Livre</option>
                                        <option value="10">10 anos</option>
                                        <option value="12">12 anos</option>
                                        <option value="14">14 anos</option>
                                        <option value="16">16 anos</option>
                                        <option value="18">18 anos</option>
                                    </select>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Duração (minutos) *</label>
                                    <input type="number" class="form-control" id="duracao" min="1" placeholder="Ex: 120"
                                        required>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label">Data de Estreia *</label>
                                <input type="date" class="form-control" id="dataEstreia" required>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 fw-bold">
                                Salvar Filme
                            </button>
                        </form>
                    </div>
                </div>

                <div class="mt-4" id="listaFilmes"></div>
            </div>
        </div>
    </div>

    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
    <script>
        function remover(id) {
            let dados = DB.buscar('filmes').filter(f => f.id !== id);
            localStorage.setItem('filmes', JSON.stringify(dados));
            listar();
        }

        function listar() {
            const filmes = DB.buscar('filmes');
            const container = document.getElementById('listaFilmes');

            if (!filmes || filmes.length === 0) {
                container.innerHTML = '<p class="text-muted text-center">Nenhum filme cadastrado ainda.</p>';
                return;
            }

            container.innerHTML = `
        <div class="card shadow-lg">
            <div class="card-header">
                <h5 class="mb-0">Filmes Cadastrados</h5>
            </div>
            <ul class="list-group list-group-flush">
                ${filmes.map(f => `
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        <div>
                            <strong>${f.titulo}</strong>
                            <span class="badge bg-secondary ms-2">${f.genero}</span>
                            <br>
                            <small class="text-muted">${f.duracao} min · ${f.classificacao} · Estreia: ${f.dataEstreia}</small>
                        </div>
                        <button 
                            class="btn btn-danger btn-sm" 
                            onclick="remover(${f.id})"
                        >
                            Excluir
                        </button>
                    </li>
                `).join('')}
            </ul>
        </div>
    `;
        }

        function init() {
            listar();
        }

        document.getElementById('formFilme').onsubmit = (e) => {
            e.preventDefault();
        };

        window.addEventListener('load', init);

        document.getElementById('formFilme').addEventListener('submit', function (e) {
            e.preventDefault();

            const novoFilme = {
                id: Date.now(),
                titulo: document.getElementById('titulo').value,
                genero: document.getElementById('genero').value,
                descricao: document.getElementById('descricao').value,
                classificacao: document.getElementById('classificacao').value,
                duracao: parseInt(document.getElementById('duracao').value),
                dataEstreia: document.getElementById('dataEstreia').value
            };

            if (DB.salvar('filmes', novoFilme)) {
                const alertasDiv = document.getElementById('alertas');
                alertasDiv.innerHTML = `
                    <div class="alert alert-success alert-dismissible fade show" role="alert">
                        Filme "${novoFilme.titulo}" cadastrado com sucesso!
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                `;
                this.reset();
                listar();
            }
        });
    </script>
</body>

</html>
